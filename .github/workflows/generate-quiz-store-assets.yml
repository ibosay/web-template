name: Generate Quiz Arena Store Assets

on:
  push:
    branches:
      - app/quiz-capacitor
    paths:
      - store-assets/quiz-arena-app-icon.svg
      - store-assets/quiz-arena-splash.svg
      - store-assets/quiz-arena-google-play-feature.svg
      - scripts/generate_quiz_store_assets.py
      - .github/workflows/generate-quiz-store-assets.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: app/quiz-capacitor
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install render dependencies
        run: python -m pip install --disable-pip-version-check cairosvg==2.8.2 pillow==11.3.0

      - name: Generate iOS and Android assets
        run: python scripts/generate_quiz_store_assets.py

      - name: Commit generated binaries
        shell: bash
        run: |
          if git diff --quiet -- ios/App/App/Assets.xcassets android/app/src/main/res store-assets/generated; then
            echo "Store assets already match their SVG sources."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          git add ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732.png
          git add ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-1.png
          git add ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732-2.png
          git add android/app/src/main/res/mipmap-*/ic_launcher.png
          git add android/app/src/main/res/mipmap-*/ic_launcher_round.png
          git add android/app/src/main/res/mipmap-*/ic_launcher_foreground.png
          git add android/app/src/main/res/drawable/splash.png
          git add android/app/src/main/res/drawable-port-*/splash.png
          git add android/app/src/main/res/drawable-land-*/splash.png
          git add store-assets/generated/google-play-icon-512.png
          git add store-assets/generated/google-play-feature-1024x500.png
          git commit -m "Generate Quiz Arena mobile store assets"
          git pull --rebase origin app/quiz-capacitor
          git push origin HEAD:app/quiz-capacitor
