<script type="module">
try{
  const encoded=(window.FP_PARTS||[]).join("");
  if(!encoded) throw new Error("missing-data");
  const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
}catch(error){document.body.innerHTML='<div class="load"><b>Friseurplan konnte nicht geladen werden.</b><br>Bitte einen aktuellen Browser verwenden.</div>';}
