                  ctx.stroke();
              }

              ctx.restore();
          });

          // Magnet-Items zum Einsammeln zeichnen
          magnetItems.forEach(m => {
              ctx.save();
              ctx.translate(m.x + m.w/2, m.y + m.h/2);
              ctx.rotate(m.angle);

              ctx.shadowBlur = 15;
              ctx.shadowColor = '#3b82f6'; // Blaues Magnet-Glow

              // Hufeisen-Form
              ctx.strokeStyle = '#ef4444'; // Roter Körper
              ctx.lineWidth = 6;
              ctx.lineCap = 'round';
              ctx.beginPath();
              ctx.arc(0, -3, 8, Math.PI, 0); // Bogen oben
              ctx.lineTo(8, 8);
              ctx.moveTo(-8, -3);
              ctx.lineTo(-8, 8);
              ctx.stroke();

              // Silberne Magnetpole
              ctx.strokeStyle = '#d1d5db';
              ctx.beginPath();
              ctx.moveTo(-8, 5); ctx.lineTo(-8, 8);
              ctx.moveTo(8, 5); ctx.lineTo(8, 8);
              ctx.stroke();

              ctx.restore();
          });

          // Waffen-Items zum Einsammeln zeichnen
          axeItems.forEach(axe => {
              ctx.save();
              ctx.translate(axe.x + axe.w/2, axe.y + axe.h/2);
              ctx.rotate(axe.angle);

              const pulse = Math.sin(Date.now() / 100) * 0.5 + 0.5;

              if (selectedColor === 'schwarz') {
                  // Shuriken Item
                  ctx.shadowBlur = 15 + pulse * 10;
                  ctx.shadowColor = '#10b981';
                  ctx.fillStyle = '#10b981';
                  ctx.beginPath();
                  ctx.moveTo(0, -10); ctx.lineTo(3, -3);
                  ctx.lineTo(10, 0); ctx.lineTo(3, 3);
                  ctx.lineTo(0, 10); ctx.lineTo(-3, 3);
                  ctx.lineTo(-10, 0); ctx.lineTo(-3, -3);
                  ctx.closePath();
                  ctx.fill();
                  ctx.fillStyle = '#cbd5e1';
                  ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill();
              } else if (selectedColor === 'ssj') {
                  // Energiescheibe Item
                  ctx.shadowBlur = 15 + pulse * 10;
                  ctx.shadowColor = '#facc15';
                  ctx.fillStyle = '#fef08a';
                  ctx.beginPath();
                  for(let j=0; j<8; j++) {
                      const ang = (j / 8) * Math.PI * 2;
                      ctx.lineTo(Math.cos(ang) * 10, Math.sin(ang) * 10);
                      const ang2 = ((j + 0.5) / 8) * Math.PI * 2;
                      ctx.lineTo(Math.cos(ang2) * 7, Math.sin(ang2) * 7);
                  }
                  ctx.closePath();
                  ctx.fill();
              } else if (selectedColor === 'overlord') {
                  // Sense Item
                  ctx.shadowBlur = 15 + pulse * 10;
                  ctx.shadowColor = '#9333ea';
                  ctx.fillStyle = '#1e1b4b';
                  ctx.fillRect(-1, -12, 2, 24); // Stiel
                  ctx.fillStyle = '#d8b4fe';
                  ctx.beginPath();
                  ctx.moveTo(-1, -10);
                  ctx.quadraticCurveTo(8, -10, 12, 5);                  ctx.quadraticCurveTo(5, -2, -1, -5);
                  ctx.closePath();
                  ctx.fill();
              } else if (selectedColor === 'fighter') {
                  // Schwert Item
                  ctx.shadowBlur = 15 + pulse * 10;
                  ctx.shadowColor = '#cbd5e1';
                  ctx.fillStyle = '#0f172a';
                  ctx.fillRect(-1, -2, 2, 8); // Griff
                  ctx.fillStyle = '#eab308';
                  ctx.fillRect(-2, 5, 4, 2); // Knauf
                  ctx.fillStyle = '#e2e8f0';
                  ctx.beginPath();
                  ctx.moveTo(-0.5, 5);
                  ctx.quadraticCurveTo(2, -8, -1, -15); // Klinge
                  ctx.quadraticCurveTo(0, -8, -0.5, 5);
                  ctx.closePath();
                  ctx.fill();
              } else if (selectedColor === 'blitz') {
                  // Blitzschwert Item
                  ctx.shadowBlur = 15 + pulse * 10;
                  ctx.shadowColor = '#d946ef';
                  ctx.fillStyle = '#fdf4ff';
                  ctx.strokeStyle = '#d946ef';
                  ctx.lineWidth = 1.5;
                  ctx.beginPath();
                  ctx.moveTo(-2, 0); ctx.lineTo(-4, -10); ctx.lineTo(0, -18);
                  ctx.lineTo(4, -10); ctx.lineTo(2, 0);
                  ctx.closePath();
                  ctx.fill(); ctx.stroke();
              } else {
                  // Axt Item (Standard / Feuer)
                  ctx.shadowBlur = 15 + pulse * 10;
                  if (selectedColor === 'feuer') {
                      ctx.shadowColor = '#f97316';
                      ctx.fillStyle = '#7c2d12';
                  } else {
                      ctx.shadowColor = '#06b6d4';
                      ctx.fillStyle = '#334155';
                  }

                  ctx.fillRect(-3, -16, 6, 32); // Griff

                  if (selectedColor === 'feuer') {
                      ctx.fillStyle = '#fde047';
                      ctx.strokeStyle = '#ef4444';
                  } else {
                      ctx.fillStyle = '#e0f2fe';
                      ctx.strokeStyle = '#06b6d4';
                  }
                  ctx.lineWidth = 2;
                  ctx.beginPath();
                  ctx.moveTo(3, -12); ctx.lineTo(16, -20); ctx.lineTo(22, -10);
                  ctx.lineTo(16, 0); ctx.lineTo(3, -6);
                  ctx.closePath();
                  ctx.fill(); ctx.stroke();
              }

              ctx.restore();
          });

          // Münzen (Klassisch glänzendes Gold)
          coinItems.forEach(c => {
              ctx.save();
              ctx.translate(c.x, c.y);

              ctx.shadowBlur = 15;
              ctx.shadowColor = '#eab308';
              ctx.fillStyle = '#f59e0b';
              ctx.beginPath();
              ctx.arc(0, 0, c.r, 0, Math.PI * 2);
              ctx.fill();

              // Innerer Goldring
              ctx.strokeStyle = '#fef08a';
              ctx.lineWidth = 2.5;
              ctx.beginPath();
              ctx.arc(0, 0, c.r - 3, 0, Math.PI * 2);
              ctx.stroke();

              ctx.restore();
          });

          // Partikel
          particles.forEach(p => {
              ctx.shadowBlur = 8;
              ctx.shadowColor = p.color;
              ctx.fillStyle = p.color;
              const particleSize = p.size * (p.life / p.maxLife);

              if (p.shape === 'fragment') {
                  ctx.save();
                  ctx.translate(p.x, p.y);
                  ctx.rotate(p.rotation || 0);
                  ctx.fillRect(-particleSize / 2, -particleSize / 2, particleSize, particleSize);
                  ctx.restore();
              } else {
                  ctx.beginPath();
                  ctx.arc(p.x, p.y, particleSize, 0, Math.PI * 2);
                  ctx.fill();
              }
          });

          ctx.shadowBlur = 0;
      }

      function gameLoop() {
          update();
          draw();
          requestAnimationFrame(gameLoop);
      }

      // Startkonfiguration
      resize();
      updateColorTheme();
      gameLoop();
    </script>
  </body>
</html>
