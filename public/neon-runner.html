        let width = 0;

        const isMobileScreen = () => matchMedia('(pointer: coarse)').matches || innerWidth < 600;
        let graphicsQuality = 'max';
        let performanceThrottle = false;
        let slowFrames = 0;
        let fastFrames = 0;
        let canvasScale = 1;
        try {
            const savedQuality = localStorage.getItem('neonRunnerGraphics');
            if (['weak', 'normal', 'max'].includes(savedQuality)) graphicsQuality = savedQuality;
        } catch (_) { /* Privater Modus kann Speicher sperren. */ }
        qualitySelect.value = graphicsQuality;
        function targetScale() {
            const mobile = isMobileScreen();
            let desired = graphicsQuality === 'weak' ? 1 : graphicsQuality === 'normal' ? (mobile ? 1.1 : 1.25) : (mobile ? 1.5 : 2);
            let pixelBudget = graphicsQuality === 'weak' ? 900000 : graphicsQuality === 'normal' ? 1400000 : mobile ? 1800000 : 2600000;
            if(performanceThrottle) { desired=Math.min(desired,mobile ? 1 : 1.25);pixelBudget=Math.min(pixelBudget,1400000); }
            return Math.max(.7, Math.min(devicePixelRatio || 1, desired, Math.sqrt(pixelBudget / Math.max(1,width*height))));
        }
        function qualityShadow(value) {
            return graphicsQuality === 'weak' ? 0 : (graphicsQuality === 'normal' || performanceThrottle ? Math.min(value,8) : value);
        }
        function applyGraphicsQuality() {
            canvasScale = targetScale();
            canvas.width = Math.max(1, Math.round(width * canvasScale));
            canvas.height = Math.max(1, Math.round(height * canvasScale));
            ctx.setTransform(canvas.width / width, 0, 0, canvas.height / height, 0, 0);

        window.addEventListener('resize', resize);

        function getObstacleVariant() {
            switch (selectedColor) {
                case 'overlord': return 'pillar';
                case 'feuer': return 'water';
                case 'schwarz': return 'samurai';
                case 'ssj': return 'energy';
                case 'fighter': return 'spearman';
                case 'blitz': return 'tesla';
                case 'red': return 'ice';
                case 'hubschrauber': return 'turret';
                default: return 'box';
            }
        }
        function createObstacle(variant = getObstacleVariant(), offset = 0) {
            const sizes = {pillar:[30,82],water:[42,52],samurai:[40,68],energy:[34,66],spearman:[36,72],tesla:[30,76],ice:[34,58],turret:[46,66],spike:[48,27],hover:[38,22]};
            let w, h;
            if (sizes[variant]) { [w,h] = sizes[variant]; }
            else { h = Math.floor(Math.random()*32)+38; w = Math.floor(Math.random()*15)+26; }
            const obs = {type:'theme',variant,x:width+20+offset,y:variant==='hover'?groundY-125:groundY-h,w,h};
            if(variant==='hover'){obs.baseY=obs.y;obs.phase=Math.random()*Math.PI*2;}
            if(variant==='samurai')obs.attack={phase:'idle',ticks:0,angle:-1.2};
            obs.shapes = getObstacleShapes(obs);
            return obs;
        }
        function challengeTier() {
            return runTicks < 180 ? 0 : runTicks < 720 ? 1 : runTicks < 1500 ? 2 : 3;
        }
        function chooseObstacleKind(tier) {
            const themed = getObstacleVariant();
            let kind = themed;

                const roll=Math.random();
                kind=roll < .42 ? themed : roll < .72 ? 'spike' : 'hover';
                if(kind === lastObstacleKind && Math.random() < .7) kind=kind==='hover' ? 'spike' : 'hover';
            }
            lastObstacleKind=kind;
            return kind;
        }
        function spawnChallenge() {
            const tier=challengeTier();

            if((tier===2 && obstacleGroups%3===0) || (tier===3 && obstacleGroups%2===0)){
                const next=kind==='hover' ? 'spike' : kind==='spike' ? getObstacleVariant() : 'hover';
                group.push(createObstacle(next,240));
            }
            return group;

        function getObstacleShapes(obs) {
            const {w,h,variant} = obs;
            const rect=(x,y,rw,rh)=>[[x,y],[x+rw,y],[x+rw,y+rh],[x,y+rh]];
            const circle=(x,y,r)=>Array.from({length:24},(_,i)=>[x+Math.cos(i*Math.PI/12)*r,y+Math.sin(i*Math.PI/12)*r]);
            const rounded=(radius)=>{
                const points=[];
                [[w-radius,radius,-Math.PI/2],[w-radius,h-radius,0],[radius,h-radius,Math.PI/2],[radius,radius,Math.PI]].forEach(([x,y,a])=>{
