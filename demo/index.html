<!DOCTYPE html>
<html lang="de-AT">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the layout reach under the notch, where env(safe-area-inset-*)
         keeps the content clear of it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="description" content="Verkehrszeichen-Assistent, Testversion." />

    <title>Verkehrszeichen-Assistent (Demo)</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- iOS ignores the manifest and reads these instead. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zeichen-Demo" />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #1f2937;
      }
      /* Nothing to drag on a page that fills the screen; this keeps the pull-to-refresh gesture
         from firing while the driver taps a button. */
      body {
        overscroll-behavior-y: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
