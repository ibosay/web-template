name: WertScan Tests

on:
  push:
    branches:
      - feature/wertscan-flea-market-matching
    paths:
      - 'wertscan/**'
      - '.github/workflows/wertscan-tests.yml'
  pull_request:
    paths:
      - 'wertscan/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run WertScan tests
        run: bash wertscan/run-tests.sh
