<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seite nicht gefunden – Servano</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#21384f" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2321384f'/%3E%3Ctext x='16' y='23' font-family='Segoe UI,Arial' font-size='20' font-weight='700' fill='%232f7fd1' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script>
      try {
        var savedTheme = JSON.parse(localStorage.getItem('servano.theme'));
        if (savedTheme === 'dark' || savedTheme === 'light') {
          document.documentElement.setAttribute('data-theme', savedTheme);
        }
      } catch (e) {}
    </script>
  </head>
  <body data-page="404">
    <div data-header></div>

    <main id="main" class="container">
      <div class="empty-state" style="margin-top: 40px">
        <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
        <h1>Diese Seite gibt es nicht</h1>
        <p>
          Der Link ist veraltet oder enthält einen Tippfehler. Über die Suche finden Sie den passenden Betrieb
          in wenigen Sekunden.
        </p>
        <div class="filters" style="justify-content: center">
          <a class="btn btn--primary" href="index.html">Zur Suche</a>
          <a class="btn btn--secondary" href="info.html">So funktioniert's</a>
        </div>
      </div>
    </main>

    <div data-footer></div>

    <script src="assets/js/icons.js"></script>
    <script src="assets/js/util.js"></script>
    <script src="assets/js/layout.js"></script>
  </body>
</html>
